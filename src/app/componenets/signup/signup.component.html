<div
class="h-[500px] w-[650px] border border-white border-opacity-50 bg-white bg-opacity-10 backdrop-blur-sm rounded-2xl shadow-md  animate-fade-right animate-once animate-duration-1000 animate-ease-in-out">
<div class="flex justify-center mt-12 mb-20">
  <h1  class="font-bold text-2xl text-white drop-shadow-lg capitalize flex items-center gap-2">
  <span [ngClass]="signup.validation==='yes'?'text-green-600 animate-fade-down animate-once animate-duration-[600ms]':''">{{signup.validation==='yes'?' Inscription complétée avec succès.':'Inscription '}}</span> 
  @if(signup.validation==='yes'){
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 animate-jump-in animate-once animate-duration-700 text-green-600">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
    </svg>
  }
  </h1>
</div>
<div class="flex flex-col  gap-14 mx-10">
    <div class="grid grid-cols-12">
      <div class="col-span-4 mx-2">
        <div class="form-items w-full">
            <svg
             [ngClass]="{
              'email ':signup.isFocused==='email',
              'password': signup.isFocused==='password' ,
              'submit': signup.isFocused==='submit',
              'identification': signup.isFocused==='identification',
              'adresse':signup.isFocused==='adresse',
              'contact':signup.isFocused==='contact',
              'confirmer':signup.isFocused==='confirmer',
              }" 
            viewBox="0 0 320 300" class="absolute transition-colors top-56">
            <defs>
              <linearGradient id="linearGradient" x1="13" y1="193.49992" x2="307" y2="193.49992"
                gradientUnits="userSpaceOnUse">
                <stop offset="0" id="stop876" style="stop-color: #ffffff" />
                <stop offset="1" id="stop878" [style]="signup.checkEquality() && signup.isEmailValid() && signup.checkString()  ? 'stop-color:'+'#530074':'stop-color:'+'red'" />
              </linearGradient>
            </defs>
            <path id="emailPath"
              d="m 40,120.00016 239.99984,-3.2e-4 c 0,0 24.99263,0.79932 25.00016,35.00016 0.008,34.20084 -25.00016,35 -25.00016,35 h -239.99984 c 0,-0.0205 -25,4.01348 -25,38.5 0,34.48652 25,38.5 25,38.5 h 215 c 0,0 20,-0.99604 20,-25 0,-24.00396 -20,-25 -20,-25 h -190 c 0,0 -20,1.71033 -20,25 0,24.00396 20,25 20,25 h 168.57143"
              class="path" 
              />
          </svg>
          <input (focus)="signup.onIdentificationFocus()"  type="text" required autocomplete="off"
            class="select-none text-white bg-transparent outline-none font-normal text-sm rounded-lg focus:outline-none focus:ring-0 border-none focus:border-none block w-full px-2.5 py-1 dark-text-white ng-untouched ng-pristine ng-valid"
            [(ngModel)]='signup.identification'  /><label class="font-medium text-white"><span
              class="drop-shadow-lg capitalize">identification</span></label>
              <button
            class="animate-rotate-y text-white animate-duration-[3000ms] animate-ease-in-out absolute top-[4.3px] right-1">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-3.17.789 6.721 6.721 0 0 1-3.168-.789 3.376 3.376 0 0 1 6.338 0Z" />
              </svg>
              
          </button>
          <div [ngClass]="signup.isFocused==='identification'?'brr':''"  class="w-full h-[2px] mt-[4px] bg-white "></div>
        </div>
      </div>
      <div class="col-span-8 mx-2">
        <div class="form-items w-full">
          @if(!signup.isEmailValid()){
                      <span [ngClass]="signup.validation==='no'?'animate-shake animate-twice animate-duration-500 animate-ease-in-out':''" class="absolute text-xs w-56 top-10 text-red-500 drop-shadow">Format d'email invalide</span>
          }
          <input (focus)="signup.onEmailFocus()"  type="email" required autocomplete="off"
            class="select-none text-white bg-transparent outline-none font-normal text-sm rounded-lg focus:outline-none focus:ring-0 border-none focus:border-none block w-full px-2.5 py-1 dark-text-white ng-untouched ng-pristine ng-valid"
            [(ngModel)]='signup.email' (input)="signup.isEmailValid()" /><label class="font-medium text-white"><span
              class="drop-shadow-lg">Email</span></label>
              <button
              [ngClass]="!signup.isEmailValid()?'text-red-600':'text-white'" 
            class="animate-rotate-y animate-duration-[3000ms] animate-ease-in-out absolute top-[4.3px] right-1">
            @if(!signup.isEmailValid()){
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
              </svg>
            }@else {
              <svg  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
              </svg>
            }  
          </button>
          <div [ngClass]="signup.isFocused==='email'?'brr':''"  class="w-full h-[2px] mt-[4px] bg-white "></div>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-12">
      <div class="col-span-4 mx-2">
        <div class="form-items w-full">
          <input (focus)="signup.onContactFocus()"  type="tel" required autocomplete="off"
            class="select-none text-white bg-transparent outline-none font-normal text-sm rounded-lg focus:outline-none focus:ring-0 border-none focus:border-none block w-full px-2.5 py-1 dark-text-white ng-untouched ng-pristine ng-valid"
            [(ngModel)]='signup.contact'  /><label class="font-medium text-white"><span
              class="drop-shadow-lg capitalize">contact</span></label>
              <button
            class="animate-rotate-y text-white animate-duration-[3000ms] animate-ease-in-out absolute top-[4.3px] right-1">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z" />
              </svg>
          </button>
          <div [ngClass]="signup.isFocused==='contact'?'brr':''"  class="w-full h-[2px] mt-[4px] bg-white "></div>
        </div>
      </div>
      <div class="col-span-8 mx-2">
        <div class="form-items ">
          <input (focus)="signup.onAdresseFocus()"  type="text" required autocomplete="off"
            class="select-none text-white bg-transparent outline-none font-normal text-sm rounded-lg focus:outline-none focus:ring-0 border-none focus:border-none block w-full px-2.5 py-1 dark-text-white ng-untouched ng-pristine ng-valid"
            [(ngModel)]='signup.adresse'  /><label class="font-medium text-white"><span
              class="drop-shadow-lg capitalize">adresse</span></label>
              <button
            class="animate-rotate-y text-white animate-duration-[3000ms] animate-ease-in-out absolute top-[4.3px] right-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" />
            </svg>            
            
          </button>
          <div [ngClass]="signup.isFocused==='adresse'?'brr':''"  class="w-full h-[2px] mt-[4px] bg-white "></div>
        </div>
      </div>
    </div>
<div class="flex w-full justify-center">
   <div class="grid grid-cols-2 w-[70%]">
      <div class="form-items mx-2 ">
        @if(!signup.checkString()){
                  <span [ngClass]=" signup.validation==='no'?'animate-shake animate-twice animate-duration-500 animate-ease-in-out':''" class="absolute text-xs w-56 top-10 text-red-500 drop-shadow">Mot de passe sécurisé requis</span>
        }
        <input  (focus)="signup.onPasswordFocus()"required autocomplete="off"
          class="select-none text-white bg-transparent outline-none font-normal text-sm rounded-lg focus:outline-none focus:ring-0 border-none focus:border-none block  w-[90%] px-2.5 py-1 dark-text-white ng-untouched ng-pristine ng-valid"
          [type]="signup.showPassword?'text':'password'" (input)="signup.checkString()" [(ngModel)]='signup.password' /><label class="font-medium text-white">
            <span class="drop-shadow-lg">Mot de passe</span></label>
            <button [ngClass]="!signup.checkString()?'text-red-600':'text-white'" (click)="signup.showPasswordHnadler()"
          class="absolute top-[3px] right-1  animate-rotate-y animate-duration-[3000ms] animate-ease-in-out">
          @if(!signup.checkString()){
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
            </svg>
          }@else {
            @if(signup.showPassword){
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
              </svg>
            }@else{
             <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            }       
          }
        </button>
        <div  [ngClass]="signup.isFocused==='password'?'brr':''" class="w-full h-[2px] mt-[4px] bg-white"></div>
      </div>
      <div class="form-items mx-2">
        @if(!signup.checkEquality()){
           <span [ngClass]="signup.validation==='no'?'animate-shake animate-twice animate-duration-500 animate-ease-in-out':''" class="absolute text-xs w-56 top-10 text-red-500 drop-shadow">Mots de passe incompatibles</span>
        }
        <input  (focus)="signup.onConfirmerFocus()"required autocomplete="off"
          class="select-none text-white bg-transparent outline-none font-normal text-sm rounded-lg focus:outline-none focus:ring-0 border-none focus:border-none block w-[90%] px-2.5 py-1 dark-text-white ng-untouched ng-pristine ng-valid"
          [type]="signup.showPassword?'text':'password'" (input)="signup.checkEquality()" [(ngModel)]='signup.confirmer' /><label class="font-medium text-white">
            <span class="drop-shadow-lg capitalize">confirmer</span></label>
            <button [ngClass]="!signup.checkEquality()?'text-red-600':'text-white'" (click)="signup.showPasswordHnadler()"
          class="absolute top-[3px] right-1  animate-rotate-y animate-duration-[3000ms] animate-ease-in-out">
          @if(!signup.checkEquality()){
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
            </svg>
          }@else {
            @if(signup.showPassword){
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
              </svg>
            }@else{
             <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
            }       
          }
        </button>
        <div  [ngClass]="signup.isFocused==='confirmer'?'brr':''" class="w-full h-[2px] mt-[4px] bg-white"></div>
      </div>
    </div>
</div>
</div>
<div id="submit" class="flex justify-center">
  <button (click)="signup.submitHandlte()"  (focus)="signup.onSubmitFocus()" type="submit" value="Submit"
    class="mt-[2.2rem] drop-shadow-lg text-blue-950 hover:text-black hover:bg-opacity-50 font-bold focus:bg-opacity-0 focus:text-white rounded-3xl w-[224px] bg-white transition-colors text-gray py-[0.8rem]">
    <span>S'inscrire</span>
  </button>
</div>
</div>
